name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write # necesario solo para adjuntar el APK a un Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # El repo no incluye gradle-wrapper.jar, así que instalamos Gradle directamente.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # Acepta las licencias del SDK para que Gradle pueda descargar lo que falte (plataforma 36, build-tools).
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Mini-release-apk
          path: app/build/outputs/apk/release/*.apk

      # Si subís un tag que empiece con "v" (por ejemplo v1.0), el APK queda como Release descargable.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
